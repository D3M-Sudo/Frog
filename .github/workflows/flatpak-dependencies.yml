name: Check Flatpak Dependencies

on:
  schedule:
    # Run weekly (same as Dependabot)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Ownership boundary: this workflow owns upstream version discovery in the
# Flatpak manifests. dependency-sync.yml owns pyproject.toml -> uv.lock /
# Flatpak synchronization for Dependabot PRs; it is not a downstream step.

jobs:
  check-flatpak-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for available updates
        id: check
        run: |
          FEDC_HOME="$RUNNER_TEMP/fedc-home"
          mkdir -p "$FEDC_HOME"
          UPDATES_FILE="$RUNNER_TEMP/fedc-updates.md"
          : > "$UPDATES_FILE"

          for manifest in flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json; do
            if [ -f "$manifest" ]; then
              docker run --rm \
                --user $(id -u):$(id -g) \
                -e HOME=/tmp/fedc-home \
                -v "$FEDC_HOME:/tmp/fedc-home" \
                -v "${{ github.workspace }}:/github/workspace" \
                -w /github/workspace \
                ghcr.io/flathub-infra/flatpak-external-data-checker:latest \
                --update --edit-only \
                "/github/workspace/$manifest"

              if ! git diff --quiet -- "$manifest"; then
                {
                  echo "### $manifest"
                  echo
                  echo '```diff'
                  git diff --no-ext-diff -- "$manifest"
                  echo '```'
                  echo
                } >> "$UPDATES_FILE"
              fi
            fi
          done

          echo "check_completed=true" >> "$GITHUB_OUTPUT"

          if [ ! -s "$UPDATES_FILE" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates found."
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            {
              echo 'updates<<EOF'
              cat "$UPDATES_FILE"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "Updates found:"
            cat "$UPDATES_FILE"
          fi

      - name: Report general dependency updates
        if: always() && steps.check.outputs.check_completed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '📦 Flatpak Python dependencies need manual update';
            const updates = process.env.UPDATES || '';
            const hasUpdates = process.env.HAS_UPDATES === 'true';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
              creator: 'github-actions[bot]'
            });
            const existing = issues.data.find(i => i.title === title);

            if (hasUpdates) {
              const body = [
                '## Available Updates',
                '',
                'The following Flatpak dependency updates were detected by FEDC:',
                '',
                updates,
                '',
                '### Action Required',
                'These dependencies require manual testing before update.',
                '',
                '### Files to update',
                '- `flatpak/io.github.d3msudo.anura.json`',
                '- `flatpak/io.github.d3msudo.anura.local.json` (when applicable)',
                '',
                '_This issue was automatically created by the Flatpak dependency checker._'
              ].join('\\n');

              if (!existing) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['dependencies']
                });
              } else {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }
        env:
          UPDATES: ${{ steps.check.outputs.updates }}
          HAS_UPDATES: ${{ steps.check.outputs.has_updates }}

      - name: Auto-update certifi only
        run: |
          git restore -- flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json

          FEDC_HOME="$RUNNER_TEMP/fedc-home"
          TMP_DIR="${{ github.workspace }}/.fedc-certifi-tmp"
          mkdir -p "$FEDC_HOME" "$TMP_DIR"
          trap 'rm -rf "$TMP_DIR"' EXIT

          CERTIFI_MANIFEST="$TMP_DIR/io.github.d3msudo.anura.certifi.json"

          # Isolate certifi from main manifest and run FEDC once
          python3 .github/scripts/fedc_certifi.py isolate "flatpak/io.github.d3msudo.anura.json" "$CERTIFI_MANIFEST"

          docker run --rm \
            --user $(id -u):$(id -g) \
            -e HOME=/tmp/fedc-home \
            -v "$FEDC_HOME:/tmp/fedc-home" \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            ghcr.io/flathub-infra/flatpak-external-data-checker:latest \
            --update --edit-only \
            "/github/workspace/.fedc-certifi-tmp/io.github.d3msudo.anura.certifi.json"

          # Apply updated certifi source to BOTH manifests
          for MANIFEST in flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json; do
            python3 .github/scripts/fedc_certifi.py replace "$MANIFEST" "$CERTIFI_MANIFEST"
          done

          echo "Certifi update completed for both manifests. Resulting diff:"
          git diff --check
          git diff -- flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json

      - name: Create PR for certifi updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: testing
          commit-message: "chore(deps): update certifi via FEDC"
          title: "chore(deps): update certifi via FEDC"
          body: |
            Automated certifi update via flatpak-external-data-checker.

            The FEDC invocation uses a temporary manifest containing only the certifi source because the current FEDC CLI does not support filtering by source name.

            Please review and test before merging.
          branch: update-certifi
          delete-branch: true
          labels: dependencies
